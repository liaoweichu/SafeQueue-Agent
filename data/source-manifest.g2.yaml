notes:
  - "The tau2 Retail snapshot contains 114 task sessions and 550 gold actions."
  - "AgentDojo v1.2.2 exposes 831 raw compatible cases; 20 text-output-only targets are excluded, leaving 811 action-eligible cases."
  - "SafeToolBench is calibration-only: 150 deterministic, unique, quality-score-at-least-7 risky tool plans are paired with 50 benign tau2 actions."
  - "The SafeToolBench paper reports 1,200 samples, while the pinned public archive contains 1,000 rows; the audit excludes 16 rows below score 7 and 86 duplicate normalized instructions, leaving 898 eligible unique rows."
